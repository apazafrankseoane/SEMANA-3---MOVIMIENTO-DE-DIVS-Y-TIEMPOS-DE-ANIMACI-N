<html>
<head>
    <title>ANIMACION 3 CSS</title>
    <style>

        *{
            padding: 0px;
            margin: 0px;
        }
        .contenedor{
            width: 400px;
            height: 200px;
            border: 1px solid black;
            background-color: black;
            position: relative; /*para centrar el div*/
            margin: 0 auto; /*para centrar el div*/
            overflow: hidden; /*muestra solo lo interior*/
        }

        .estrellita1{
            width:3px;
            height:3px;
            background:white;
            position:absolute;
            top:40px;
            animation:estrellas 3s infinite linear;
        }

        .estrellita2{ 
            width:3px;height:3px;
            background:white;
            position:absolute;
            top:35px;
            animation:estrellas 2.8s infinite linear;
        }

        .estrellita3{ 
            width:2px;
            height:2px;
            background:white;
            position:absolute;
            top:100px;left:50px;
            animation:estrellas 3.2s infinite linear;
        }

        .estrellita4{ 
            width:3px;
            height:3px;
            background:white;
            position:absolute;
            top:150px;left:120px;
            animation:estrellas 3.5s infinite linear;
        }

        .estrellita5{ 
            width:2px;
            height:2px;
            background:white;
            position:absolute;
            top:180px;
            left:200px;
            animation:estrellas 2.7s infinite linear;
        }

        .estrellita6{
             width:3px;
             height:3px;
             background:white;
             position:absolute;
             top:25px;left:300px;
             animation:estrellas 3.1s infinite linear;
        }

        .estrellita7{ 
            width:2px;
            height:2px;
            background:white;
            position:absolute;
            top:55px;
            left:250px;
            animation:estrellas 2.9s infinite linear;
        }
            
        .estrellita8{ 
            width:3px;
            height:3px;
            background:white;
            position:absolute;
            top:80px;left:180px;
            animation:estrellas 3.3s infinite linear;
        }

        .estrellita9{ 
            width:2px;
            height:2px;
            background:white;
            position:absolute;
            top:120px;left:350px;
            animation:estrellas 2.6s infinite linear;
        }

        .estrellita10{ 
            width:3px;
            height:3px;
            background:white;
            position:absolute;
            top:165px;left:100px;
            animation:estrellas 3.4s infinite linear;
        }

        .estrellita11{ 
            width:2px;
            height:2px;
            background:white;
            position:absolute;
            top:49px;left:270px;
            animation:estrellas 2.8s infinite linear;
        }

        .estrellita12{ 
            width:3px;
            height:3px;
            background:white;
            position:absolute;
            top:66px;left:320px;
            animation:estrellas 3.2s infinite linear;
        }

        .estrellita13{ 
            width:2px;
            height:2px;
            background:white;
            position:absolute;
            top:15px;left:60px;
            animation:estrellas 2.5s infinite linear;
        }

        .estrellita14{ 
            width:3px;
            height:3px;
            background:white;
            position:absolute;
            top:140px;left:210px;
            animation:estrellas 3.6s infinite linear;
        }

        .estrellita15{ 
            width:2px;
            height:2px;
            background:white;
            position:absolute;
            top:95px;left:140px;
            animation:estrellas 2.7s infinite linear;
        }

        @keyframes estrellas{
            from{
                left: 500px
            }
            to{
                left: -100px
            }
        }






        .cuadrito{
            width: 100px;
            height: 100px;
            position: absolute; /*permite mover el div dentro del cuadrito*/
            top: 50px; /* de arriba hacia abajo "top"*/ 
            left: 150px; /* de izquierda a derecha*/

            animation: girar 0.5s infinite alternate , cuadrito 3s infinite linear;

        }

        .cuadrito img{
            width: 100px;     /* LA IMAGEN OCUPARA EL MISMO TAMAÑO DEL CUADRO OSEA TODO*/
            height: 100px;
        }

        @keyframes girar{
            from{
                transform: rotate(-10deg);
            }
            to{
                transform: rotate(10deg);
            }
        }

        @keyframes cuadrito{
            from{
                left: -100px
            }
            to{
                left: 500px
            }
        }

    </style>

</head>
<body>

    <div class= "contenedor">

        <div class="estrellita1"></div>
        <div class="estrellita2"></div>
        <div class="estrellita3"></div>
        <div class="estrellita4"></div>
        <div class="estrellita5"></div>
        <div class="estrellita6"></div>
        <div class="estrellita7"></div>
        <div class="estrellita8"></div>
        <div class="estrellita9"></div>
        <div class="estrellita10"></div>
        <div class="estrellita11"></div>
        <div class="estrellita12"></div>
        <div class="estrellita13"></div>
        <div class="estrellita14"></div>
        <div class="estrellita15"></div>

        <div class="cuadrito">
            <img src="img/goku.gif" alt="">
        </div>

    </div>

</body>
</html>
